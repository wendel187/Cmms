<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de OS - CMMS</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="historico.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>⚙️ CMMS</h1>
                <p>Computerized Maintenance Management System</p>
            </div>
            <div class="header-status">
                <span id="status-conexao" class="status-badge loading">Verificando...</span>
            </div>
        </header>

        <!-- Breadcrumb / Navigation -->
        <div class="breadcrumb">
            <a href="/" class="breadcrumb-link">← Voltar ao Sistema</a>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="section-card">
                <div class="section-header">
                    <h2>📋 Histórico da Ordem de Serviço</h2>
                    <p class="section-subtitle">Visualize o histórico de alterações e status da OS</p>
                </div>

                <!-- Formulário de Busca -->
                <div class="form-search">
                    <form id="form-buscar-historico" class="form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="historico-os-id">ID da Ordem de Serviço *</label>
                                <input
                                    type="number"
                                    id="historico-os-id"
                                    name="osId"
                                    required
                                    placeholder="Ex: 1"
                                    min="1"
                                >
                            </div>
                            <div class="form-group form-group-button">
                                <button type="submit" class="btn btn-primary btn-search">
                                    <span class="icon">🔍</span> Buscar Histórico
                                </button>
                            </div>
                        </div>
                    </form>
                    <div id="historico-feedback" class="feedback"></div>
                </div>

                <!-- Área de Resultados -->
                <div id="historico-results" style="display: none;">
                    <div class="result-header">
                        <h3 id="historico-titulo">Histórico da OS #1</h3>
                        <span id="historico-quantidade" class="result-count"></span>
                    </div>

                    <!-- Loading -->
                    <div id="historico-loading" class="loading-spinner" style="display: none;">
                        <div class="spinner"></div>
                        <p>Carregando histórico...</p>
                    </div>

                    <!-- Tabela de Histórico -->
                    <div id="historico-lista" class="historico-table-container"></div>
                </div>

                <!-- Mensagem Inicial -->
                <div id="historico-empty" class="item-empty">
                    <div class="item-empty-icon">📋</div>
                    <p>Digite o ID da Ordem de Serviço e clique em "Buscar Histórico"</p>
                </div>
            </div>
        </main>

        <!-- Toast Notification -->
        <div id="toast" class="toast"></div>
    </div>

    <script type="module" src="historico.js"></script>
</body>
</html>
